error_reporting = E_ERROR
error_log = /var/www/html/storage/logs/php-error.log
log_errors = Off
log_errors_max_len = 8192
ignore_repeated_errors = On
ignore_repeated_source = On

upload_max_filesize = 256M
post_max_size = 256M
memory_limit = ${PHP_MEMORY_LIMIT:-512M}

; CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp): session upload progress is the confirmed FPM exploit path.
; Coolify does not use this feature, so keep it disabled even after upgrading.
session.upload_progress.enabled = Off

; Bound multipart/input processing (advisory hardening, also reduces OOM DoS risk).
max_input_nesting_level = 32
max_file_uploads = 10
