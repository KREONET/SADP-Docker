listen 8080 default_server;
listen [::]:8080 default_server;

root /var/www/html/public;

# Set allowed "index" files
index index.html index.htm index.php;

server_name _;

charset utf-8;

# Do not reveal the nginx version (Server header, error pages) or the PHP version (X-Powered-By).
# Set at server level so it cannot clash with a server_tokens directive in the base image's http block.
server_tokens off;
fastcgi_hide_header X-Powered-By;

# Match post_max_size so oversized bodies never reach PHP (CVE-2026-109618 hardening).
# Database imports upload in 10MB chunks, so 256M is plenty.
client_max_body_size 256M;

# Set client body buffer to handle Sentinel payloads in memory
client_body_buffer_size 256k;

# Healthchecks: Set /healthcheck to be the healthcheck URL
location /healthcheck {
    access_log off;

    # set max 5 seconds for healthcheck
    fastcgi_read_timeout 5s;

    include        fastcgi_params;
    fastcgi_param  SCRIPT_NAME     /healthcheck;
    fastcgi_param  SCRIPT_FILENAME /healthcheck;
    fastcgi_pass   127.0.0.1:9000;
}

# Have NGINX try searching for PHP files as well
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Pass "*.php" files to PHP-FPM
location ~ \.php$ {
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    include        fastcgi_params;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 99;
}
