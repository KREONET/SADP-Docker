listen 8080 default_server;
listen [::]:8080 default_server;

root /var/www/html/public;

# Set allowed "index" files
index index.html index.htm index.php;

server_name _;

charset utf-8;

# Do not reveal the nginx version (Server header, error pages) or the PHP version (X-Powered-By).
# Set at server level so it cannot clash with a server_tokens directive in the base image's http block.
server_tokens off;
fastcgi_hide_header X-Powered-By;

# Match post_max_size so oversized bodies never reach PHP (CVE-2026-109618 hardening).
# Database imports upload in 10MB chunks, so 256M is plenty.
client_max_body_size 256M;

# Set client body buffer to handle Sentinel payloads in memory
client_body_buffer_size 256k;

# Healthchecks: Set /healthcheck to be the healthcheck URL
location /healthcheck {
    access_log off;

    # set max 5 seconds for healthcheck
    fastcgi_read_timeout 5s;

    include        fastcgi_params;
    fastcgi_param  SCRIPT_NAME     /healthcheck;
    fastcgi_param  SCRIPT_FILENAME /healthcheck;
    fastcgi_pass   127.0.0.1:9000;
}

# The Vite manifest is read from disk by the @vite Blade directive; browsers never need it.
# Serving it only fingerprints the build (security assessment F-01 / F-07).
location = /build/manifest.json {
    access_log off;
    return 404;
}

# Hashed build assets never change for a given URL.
location ^~ /build/assets/ {
    access_log off;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Proxy the realtime (Reverb) and terminal WebSockets that run in this container, so the
# browser reaches them through this port and 6001/6002 never have to be published on the host
# (security assessment F-03 / F-06). Only the Pusher client path /app/ is forwarded: the Reverb
# HTTP API (/apps/...) stays reachable from inside the container only.
location /app/ {
    proxy_pass http://127.0.0.1:6001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /terminal/ws {
    proxy_pass http://127.0.0.1:6002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Have NGINX try searching for PHP files as well
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Pass "*.php" files to PHP-FPM
location ~ \.php$ {
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    include        fastcgi_params;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 99;
}
